name: ASENA APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -       - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ZIP dosyasını aç
        run: unzip -q ASENA_Gelismis_Proje.zip

      - name: Java ve Kotlin hedefini 17 yap
        working-directory: AsenaAndroid
        run: |
          sed -i '/compileOptions {/a\        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts

      - name: APK oluştur
        working-directory: AsenaAndroid
        run: gradle assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: ASENA-APK
          path: AsenaAndroid/app/build/outputs/apk/debug/app-debug.apk
          
